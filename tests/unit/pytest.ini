# The unit suite on its own: no Django settings, no database, no environment variables.
#
#     pytest -c tests/unit/pytest.ini tests/unit
#
# The brief asks for unit tests that prove the system meets its requirements. A reviewer
# should be able to run them with nothing but Python and pytest installed (plus the tzdata
# package on Windows, which has no time-zone database of its own), so this suite may import
# only the standard library and rentals.domain. CI runs it with Django not even installed
# to keep that true.
[pytest]
pythonpath = ../..
# no:django, because pytest-django imports the settings, and the settings rightly refuse
# to load without their secrets.
addopts = -ra --strict-markers --strict-config -p no:django -p no:cacheprovider
filterwarnings = error
