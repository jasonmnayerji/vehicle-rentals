{% extends "base.html" %}

{% block title %}Log in · Vehicle rentals{% endblock %}

{% block content %}
  <section class="card narrow">
    <h1>Log in</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% for error in form.non_field_errors %}
        <div class="note error" role="alert">{{ error }}</div>
      {% endfor %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <div class="actions"><button type="submit">Log in</button></div>
    </form>
    <p class="hint">No account? <a href="{% url 'signup' %}">Sign up</a>.</p>
  </section>
{% endblock %}
